<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hilo onboarding — concept by Illia Vostrikov</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --font-display: ui-serif, "New York", "Iowan Old Style", "Charter", Georgia, serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --ink:#111813; --ink-2:#3E4943; --ink-3:#5E6A63;
  --line:#DCE3DE; --bg:#F5F4EF; --surface:#FFFFFF;
  --primary:#0F6B3E; --primary-press:#0B5431; --on-primary:#FFFFFF;
  --green-50:#E7F3EB; --green-100:#CFE8D8;
  --lav-50:#F2EDFF; --lav-100:#E3D9FF; --lav-600:#6A4FD6;
  --alert:#B3261E;
  --brand-gradient: linear-gradient(in oklch 125deg, #2EA35F 0%, #4C86DE 42%, #7A5BE6 72%, #7A5BE6 100%);
  --radius-s:10px; --radius-m:16px; --radius-l:24px;
  --shadow: 0 1px 2px rgba(17,24,19,.06), 0 8px 24px rgba(17,24,19,.06);
}
@supports not (background: linear-gradient(in oklch, red, blue)){
  :root{ --brand-gradient: linear-gradient(125deg,#2EA35F 0%,#1FA3A0 22%,#4C86DE 45%,#7A5BE6 72%,#7A5BE6 100%); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
/* ---------- Page chrome ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;padding:20px 28px 8px}
.topbar h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0}
.topbar .disclaimer{font-size:13px;color:var(--ink-3)}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:8px 28px 16px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.steps button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:inline-flex;background:#E6E5DF;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-mode="current"][aria-pressed="true"]{color:var(--alert)}
.seg button[data-mode="proposed"][aria-pressed="true"]{color:var(--primary)}
.stage{display:grid;grid-template-columns:auto minmax(280px,460px);gap:32px;align-items:start;padding:0 28px 40px;justify-content:center}
@media (max-width:820px){.stage{grid-template-columns:1fr;justify-items:center}}
/* ---------- Phone ---------- */
.phone{width:390px;max-width:calc(100vw - 32px);height:800px;border-radius:52px;background:#0F1210;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--surface)}
.statusbar{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;font-weight:600;font-size:15px}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.statusbar .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.app{position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column}
.app .scroll{flex:1;overflow:auto;padding:8px 22px 16px}
.app .footer{padding:12px 22px 30px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,var(--surface) 75%,rgba(255,255,255,0))}
.navrow{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 14px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.progress-dots i.on{background:var(--primary)}
/* type scale */
.display{font-family:var(--font-display);font-weight:600;font-size:31px;line-height:37px;letter-spacing:-.2px;margin:12px 0 10px}
.title{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px;margin:0 0 6px}
.body{font-size:17px;line-height:24px;color:var(--ink-2);margin:0 0 14px}
.caption{font-size:14px;line-height:20px;color:var(--ink-3);font-weight:500}
.btn{border:0;border-radius:14px;min-height:54px;font-size:17px;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-press)}
.btn.secondary{background:transparent;color:var(--primary);border:1.5px solid var(--green-100)}
.btn.link{background:none;color:var(--primary);min-height:40px;text-decoration:underline;text-underline-offset:3px}
/* cards & rows */
.card{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;background:var(--surface)}
.card.selected{border:2px solid var(--primary);background:var(--green-50)}
.row{display:flex;align-items:center;gap:14px}
.flag{font-size:30px;line-height:1}
.check{width:28px;height:28px;border-radius:50%;background:var(--primary);display:grid;place-items:center;flex:none}
.list{border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.list .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:17px}
.list .item:first-child{border-top:0}
.list .item .v{margin-left:auto;font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#9B1C4B;background:#FDE8EF;border-radius:999px;padding:3px 9px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink-3);font-size:17px;margin-bottom:12px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(17,24,19,.38);display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 22px 30px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.unitseg{display:flex;background:#EEF0EE;border-radius:12px;padding:3px;margin:6px 0 18px}
.unitseg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink-2)}
.unitseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bigvalue{font-family:var(--font-display);font-size:56px;font-weight:600;text-align:center;line-height:1;margin:8px 0 2px}
.stepper{display:flex;align-items:center;gap:14px;margin:16px 0 20px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:26px;cursor:pointer;flex:none}
.stepper input{flex:1;accent-color:var(--primary);height:32px}
/* health sheet */
.health{border-radius:24px 24px 0 0;background:#F2F2F7;padding:10px 18px 26px;width:100%;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.health .hrow{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:13px 14px;border-top:1px solid #E5E5EA;font-size:16px}
.health .hrow:first-child{border-top:0;border-radius:12px 12px 0 0}.health .hrow:last-child{border-radius:0 0 12px 12px}
.toggle{width:46px;height:28px;border-radius:14px;background:#34C759;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:20px;top:2px;transition:left .2s;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.off{background:#D1D1D6}.toggle.off::after{left:2px}
.sim-tag{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#8E8E93;text-align:center;margin-bottom:8px}
.tiles{display:flex;align-items:center;justify-content:center;gap:16px;margin:26px 0 22px}
.tile{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;box-shadow:var(--shadow);background:#fff}
.tile.brand{background:var(--brand-gradient)}
.dash{width:46px;border-top:2px dashed var(--green-100)}
/* timeline */
.tl{position:relative;margin:6px 0 10px;padding-left:34px}
.tl::before{content:"";position:absolute;left:13px;top:12px;bottom:28px;width:2px;background:var(--line)}
.tl .day{position:relative;margin-bottom:12px}
.tl .dot{position:absolute;left:-34px;top:14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-3)}
.tl .day.today .dot{border-color:var(--primary);background:var(--primary);color:#fff}
.tl .day.goal .dot{border:0;background:var(--brand-gradient);color:#fff}
.tl .card .k{font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.tl .day.today .card .k{color:var(--primary)}
.tl .card .t{font-size:17px;font-weight:600;line-height:23px}
.tl .card .m{font-size:14px;color:var(--ink-3);margin-top:4px}
.tl .day.goal .card{background:var(--lav-50);border-color:var(--lav-100)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-m);font-size:16px}
/* pairing animation */
.anim{height:250px;border-radius:var(--radius-l);background:var(--lav-50);position:relative;overflow:hidden;margin:6px 0 14px}
.pod{position:absolute;left:50%;top:92px;width:120px;height:62px;margin-left:-60px;border-radius:18px;background:#1B1F1C;box-shadow:inset 0 -6px 0 rgba(255,255,255,.06)}
.strap{position:absolute;left:24px;right:24px;top:114px;height:18px;border-radius:9px;background:#3A403C}
.film{position:absolute;left:50%;top:150px;width:110px;height:10px;margin-left:-55px;border-radius:4px;background:rgba(122,91,230,.55)}
.film.go{animation:peel 1.6s ease-in-out infinite}
@keyframes peel{0%,20%{transform:none;opacity:1}70%,100%{transform:translate(70px,60px) rotate(18deg);opacity:0}}
.charger{position:absolute;left:50%;top:176px;width:150px;height:30px;margin-left:-75px;border-radius:15px;background:#C9CEC9}
.pod.drop{animation:drop 2.2s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-40px)}35%,100%{transform:translateY(48px)}}
.led{position:absolute;right:16px;top:26px;width:9px;height:9px;border-radius:50%;background:#E53935;opacity:0}
.pod.drop .led{animation:blink 2.2s infinite}
@keyframes blink{0%,40%{opacity:0}45%,52%{opacity:1}57%,62%{opacity:0}66%,73%{opacity:1}78%,100%{opacity:0}}
.phoneico{position:absolute;left:50%;top:70px;width:70px;height:120px;margin-left:-35px;border-radius:14px;border:3px solid var(--ink);background:#fff}
.ring{position:absolute;left:50%;top:130px;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid var(--primary);opacity:0;animation:ring 2s ease-out infinite}
.ring:nth-child(2){animation-delay:.7s}.ring:nth-child(3){animation-delay:1.4s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.stepdots{display:flex;gap:6px;justify-content:center;margin:-2px 0 10px}
.stepdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.stepdots i.on{background:var(--primary);width:22px;border-radius:4px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--green-100);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* progress ring */
.pring{width:170px;height:170px;margin:18px auto 6px;position:relative}
.pring .arc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg, transparent 0 0);}
.pring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.pring .lbl b{font-family:var(--font-display);font-size:44px;font-weight:600;display:block;line-height:1}
/* ---------- Current (screenshot) ---------- */
.shot{position:absolute;inset:0;overflow:auto;background:#fff}
.shot .wrap{position:relative}
.shot img{display:block;width:100%}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--alert);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(179,38,30,.25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(179,38,30,.08)}}
.shot .label{position:sticky;top:0;z-index:2;background:rgba(179,38,30,.94);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:6px}
/* ---------- Notes ---------- */
.notes{background:var(--surface);border-radius:var(--radius-l);padding:24px;box-shadow:var(--shadow);font-size:15.5px;line-height:23px}
.notes h2{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:30px;margin:0 0 4px}
.notes .kicker{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.notes .kicker.cur{color:var(--alert)} .notes .kicker.pro{color:var(--primary)}
.notes ol{padding-left:0;list-style:none;margin:14px 0 0}
.notes ol li{display:flex;gap:12px;margin-bottom:12px}
.notes ol li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--alert);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:-1px}
.notes .blk{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.notes .blk b{display:block;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.notes .hyp{font-style:italic}
.grads{display:grid;gap:8px;margin-top:8px}
.grads div{height:22px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;padding-left:8px}
.foot{font-size:13px;color:var(--ink-3);margin-top:18px}
.hint{font-size:13px;color:var(--ink-3);text-align:center;margin-top:10px}

.success{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 25%, #EDE7FF 0%, #F3F8F4 55%, #FFFFFF 100%)}
.bandwrap{position:relative;width:250px;height:140px;display:grid;place-items:center;animation:popIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.bandsvg{position:relative;z-index:1;filter:drop-shadow(0 14px 22px rgba(17,24,19,.18))}
.glow{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:var(--brand-gradient);opacity:.22;filter:blur(18px);animation:breathe 2.4s ease-in-out infinite}
.badge{position:absolute;z-index:2;right:46px;top:-2px;width:56px;height:56px;border-radius:50%;background:var(--primary);display:grid;place-items:center;box-shadow:0 0 0 6px #fff,0 8px 18px rgba(15,107,62,.35);animation:badge .5s .35s cubic-bezier(.2,.9,.3,1.4) both}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink-2);animation:rise .4s both}
.chips span:nth-child(1){animation-delay:.6s}.chips span:nth-child(2){animation-delay:.75s}.chips span:nth-child(3){animation-delay:.9s}
.autobar{height:6px;border-radius:3px;background:var(--green-100);overflow:hidden}
.autobar i{display:block;height:100%;width:100%;background:var(--primary);transform-origin:left;animation:fill 3.2s linear both}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes badge{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.32}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.hksheet{width:100%;background:#F2F2F7;border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.hknav{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.hknav button{border:0;background:none;color:#007AFF;font-size:17px;cursor:pointer;padding:4px}
.hkbody{flex:1;overflow:auto;padding:6px 16px 24px}
.hkicon{width:64px;height:64px;border-radius:15px;background:#fff;display:grid;place-items:center;margin:8px auto 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hkgroup{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:6px}
.hkrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;padding:0 14px;border:0;border-top:.5px solid #E5E5EA;background:#fff;font-size:17px;text-align:left;cursor:default}
.hkgroup .hkrow:first-child{border-top:0}
button.hkrow{cursor:pointer}
.hkhdr{font-size:13px;color:#6C6C70;text-transform:uppercase;letter-spacing:.2px;margin:16px 14px 6px}

.homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
.happ{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;background:none;border:0;color:#fff;padding:0}
.hic{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-size:28px;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative}
.hiloic{overflow:visible;cursor:pointer}.hiloic svg{width:62px;height:62px;border-radius:15px}
.tapring{position:absolute;inset:-7px;border-radius:21px;border:3px solid #fff;opacity:0;animation:tap 1.8s ease-out infinite}
@keyframes tap{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:86px;border-radius:30px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:center}
.lavbg{position:absolute;inset:0;background:linear-gradient(180deg,#CBB5FA 0%,#E6DCFD 45%,#FBF9FF 100%);overflow:hidden}
.swooshbig{position:absolute;inset:0;width:100%;height:100%}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:drawon 1.3s .15s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes drawon{to{stroke-dashoffset:0}}
.wm{position:absolute;z-index:2;left:50%;transform:translateX(-50%);animation:fade .5s ease both}
.welcome{position:absolute;z-index:2;left:22px;right:22px;bottom:30px}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.facts span{background:rgba(255,255,255,.8);border:1px solid #E3D9FF;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.acc-hero{width:120px;height:120px;border-radius:30px;margin:30px auto 10px;display:grid;place-items:center;background:linear-gradient(180deg,#CBB5FA,#F6F1FF)}
.btn[disabled]{background:#C9D6CE;color:#3E4943;cursor:not-allowed}
.ack{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:var(--radius-m);background:#fff;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.ack .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--primary);display:grid;place-items:center}
.ack .box svg{opacity:0}.ack.on{border-color:var(--primary);background:var(--green-50)}.ack.on .box{background:var(--primary)}.ack.on .box svg{opacity:1}

.homescr{position:absolute;inset:0;color:#fff;overflow:hidden}
.hslot{position:absolute;border-radius:16px;overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hslot img,.hslot svg{border-radius:16px}
.hilobtn{border:0;padding:0;background:none;cursor:pointer}
.hilobtn svg{display:block}
.hsearch{position:absolute;left:50%;transform:translateX(-50%);top:631px;height:27px;padding:0 13px;display:flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;color:rgba(255,255,255,.75);backdrop-filter:blur(8px)}
.hdock{position:absolute;left:10px;right:10px;top:674px;height:86px;border-radius:34px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.taphint{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:14px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}

.siwa{width:100%;margin:0 8px 8px;border-radius:38px;padding:22px 16px 16px;color:#fff;background:rgba(118,118,124,.94);backdrop-filter:blur(24px);box-shadow:0 -1px 0 rgba(255,255,255,.25) inset;animation:up .3s cubic-bezier(.2,.8,.2,1)}

const PROPOSED = {
 home:{title:'One brand, from the home screen', change:'The icon carries the original “hilo” wordmark on Hilo lavender, with the swoosh softly in the background, so the app is easy to find and clearly the same brand as the band, the box and the website.', hyp:'We believe a recognisable icon will increase the share of buyers who open the app soon after install.', metric:'Install → first open within 24 h'},
 splash:{title:'A splash that sets the tone', change:'The wordmark stays exactly as it is. The swoosh draws itself in about a second in a vivid gradient with no grey zone, then the app moves on by itself — no extra waiting.', hyp:'We believe a coherent brand moment raises perceived quality without slowing anyone down.', metric:'Time to first interactive screen (guardrail) · perceived quality in a first-week survey'},
 welcome:{title:'One clear next step', change:'Setup is the dominant action; returning users get a quiet link. Three short facts say what Hilo does before any commitment.', hyp:'We believe a single dominant action will increase the share of new users who start setup.', metric:'Welcome → setup started · wrong-path taps to log in'},
 account:{title:'Fastest path first, in the right order', change:'Country now comes before the account, because it decides data storage and legal texts. Sign in with Apple comes first. Terms and Privacy move into one line under the buttons (to confirm with legal).', hyp:'We believe putting the fastest sign-in first will raise account completion and cut time on step.', metric:'Account completion rate · time on step · sign-in method mix'},
 consent:{title:'Calm, not alarming', change:'Three short points with icons instead of a warning and three paragraphs. One explicit acknowledgement stays — it’s a regulatory requirement — but it reads calmly. The button explains itself.', hyp:'We believe a calmer, shorter acknowledgement keeps people moving without reducing understanding.', metric:'Drop-off on step · comprehension check in usability tests'},

 country:{title:'Detected country, one tap', change:'Pre-select the country from the phone’s region settings (no location permission needed); keep an explicit choice because country sets data storage and regulatory rules. Search for the rest.', hyp:'We believe pre-selecting the country will cut time on this step without increasing wrong-country support tickets.', metric:'Time on step · wrong-country tickets (guardrail)'},
 health:{title:'Confirm, don’t ask', change:'Offer Apple Health first, with our own short explainer before the iOS sheet (where every category starts switched off). Sign in with Apple only shares name and email — date of birth, sex, height and weight come from HealthKit with the user’s permission. Show prefilled values the user can edit.', hyp:'We believe prefilling the profile from Apple Health will reduce time on the profile step and drop-off before pairing.', metric:'Time on step · % reaching pairing · % edited values (data quality)'},
 height:{title:'Units that never get in the way', change:'Units are a separate segmented control, defaulted from the region. Switching converts the value — it never resets. Fine-tune with a slider and ± buttons.', hyp:'We believe separating units from the value will remove accidental unit switches.', metric:'Unit switches per session · time on field'},
 plan:{title:'Turn 4 days into a plan', change:'Calibration is the activation moment: value arrives only on day 4. Show each day, how long it takes and what you get at the end, with a morning reminder. (Daily steps here are illustrative — the real protocol may differ.)', hyp:'We believe a clear 4-day plan with reminders will increase the share of users who complete calibration within 7 days.', metric:'Calibration completed in 7 days · time to first report · support contacts (guardrail)'},
 pair:{title:'Show, don’t tell', change:'Three short looping animations (3–5 s) replace three paragraphs: remove the film, put the band on the charger, keep the phone close. Bluetooth permission is asked in context — the moment the user taps “Start pairing”. iOS draws the dialog; the one part Hilo controls is the purpose line, so it says plainly why. Then a clear searching state and a short success moment that moves on by itself.', hyp:'We believe visual instructions will reduce “Band not found” errors on the first attempt.', metric:'First-attempt pairing success · retries · support tickets'},
 done:{title:'Celebrate progress, set up tomorrow', change:'Close day 1 with visible progress (1 of 4) and one clear next action with a time. The brand gradient is interpolated in OKLCH, so green moves to violet through blue instead of grey.', hyp:'We believe a concrete next step will raise day-2 return during calibration.', metric:'Day-2 calibration check-in rate'}
};
let step=0, mode='proposed';
function setEmail(v){st.shareEmail=v;document.getElementById('r-share').classList.toggle('on',v);document.getElementById('r-hide').classList.toggle('on',!v)}
function toggleAck(){st.ack=!st.ack;const a=document.getElementById('ack');a.classList.toggle('on',st.ack);const b=document.getElementById('ackbtn');b.disabled=!st.ack;b.textContent=st.ack?'Continue':'Tick the box to continue'}
function hkSync(){Object.keys(st.hk).forEach(k=>{const el=document.getElementById('hk-'+k);if(el){el.classList.toggle('off',!st.hk[k]);el.setAttribute('aria-checked',st.hk[k])}});const a=document.getElementById('hk-all');if(a)a.textContent=Object.values(st.hk).every(Boolean)?'Turn Off All':'Turn On All'}
function hkAll(){const v=!Object.values(st.hk).every(Boolean);Object.keys(st.hk).forEach(k=>st.hk[k]=v);hkSync()}
function hkSet(k){st.hk[k]=!st.hk[k];hkSync()}
function hkAllow(){st.healthState=Object.values(st.hk).some(Boolean)?'done':'filled';render()}

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
document.getElementById('replay').onclick=()=>{mode='proposed';resetStep(STEPS[step].id);render()};

function resetStep(id){clearTimeout(autoT);clearTimeout(window.splashT);if(id==='account'){st.appleSheet=false;st.shareEmail=true}if(id==='consent')st.ack=false;if(id==='country')st.listOpen=false;if(id==='health'){st.healthState='intro';st.hk={dob:false,sex:false,height:false,weight:false}}if(id==='pair'){st.pairPhase=0;st.pairState='demo'}}
function go(i,keep){const prev=step;step=Math.max(0,Math.min(STEPS.length-1,i));const id=STEPS[step].id;if(!keep&&!(id==='health'&&STEPS[prev].id==='height'))resetStep(id); render(); try{history.replaceState(null,'','#'+STEPS[step].id+(mode==='current'?'-current':''))}catch(e){}}
function next(){go(step+1)}
function goId(id,keep){go(STEPS.findIndex(s=>s.id===id),keep)}
function goBack(){const id=STEPS[step].id; if(id==='plan'||id==='height') goId('health',true); else go(step-1)}

  const c=CURRENT[id];
  if(id==='home'){scr.innerHTML=status.replace('class="statusbar"','class="statusbar" style="color:#fff;position:relative;z-index:3"')+`<div class="app" style="inset:0">${homeHTML(true)}</div>`;}
  else scr.innerHTML=`<div class="shot"><div class="label">Current app · screenshot</div><div class="wrap"><img src="${IMGS[c.img]}" alt="Current Hilo screen: ${c.title}">${c.marks.map((m,i)=>`<span class="mk" style="left:${m[0]}%;top:${m[1]}%">${i+1}</span>`).join('')}</div></div>`;
  notes.innerHTML=`<div class="kicker cur">What I noticed</div><h2>${c.title}</h2><ol>${c.items.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join('')}</ol>
   <div class="foot">From my own first run on iPhone (Spain). I don’t have Hilo’s data — these are hypotheses, not verdicts.</div>`;
  $('#hint').textContent='Switch to Proposed to see the concept';
 } else {
  const p=PROPOSED[id];
  scr.innerHTML=(id==='home'?status.replace('class="statusbar"','class="statusbar" style="color:#fff;position:relative;z-index:3"'):status)+`<div class="app" ${['home','splash','welcome'].includes(id)?'style="inset:0"':''}>${proposedScreen()}</div>`;
  let extra='';
  if(id==='done'||id==='splash') extra=`<div class="blk"><b>Brand gradient</b><div class="grads"><div style="background:linear-gradient(90deg,#55AA71,#9B7BE8)">sRGB — goes grey in the middle</div><div style="background:linear-gradient(in oklch 90deg, #2EA35F 0%, #4C86DE 42%, #7A5BE6 72%, #7A5BE6 100%)">OKLCH — stays vivid</div></div></div>`;
  notes.innerHTML=`<div class="kicker pro">What I’d change</div><h2>${p.title}</h2><p>${p.change}</p>
   <div class="blk"><b>Hypothesis I’d test</b><span class="hyp">${p.hyp}</span></div>
   <div class="blk"><b>How I’d measure it</b>${p.metric}</div>${extra}
   <div class="foot">Type: serif display at 600 weight, 17 px body, AA contrast. Colours, type and radii are design tokens. Built by me with Claude in code.</div>`;
  $('#hint').textContent=id==='home'?'Tap the Hilo icon to open the app':'The prototype is clickable — use the buttons inside the phone';
 }
}
(function init(){const h=(location.hash||'').slice(1);const cur=h.endsWith('-current');const id=h.replace('-current','');const i=STEPS.findIndex(s=>s.id===id);if(i>=0)step=i;if(cur)mode='current';render()})();
</script>
</body>
